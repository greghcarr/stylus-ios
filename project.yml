name: StylusApp
options:
  bundleIdPrefix: com.greghcarr
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: "98PD5UM75Q"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_MODULE_VERIFIER: NO

targets:
  StylusApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/StylusApp
        excludes:
          - Resources/Info.plist
    info:
      path: Sources/StylusApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Stylus
        CFBundleShortVersionString: 0.1.0
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        # Bootstraps the "On My iPhone" surface in the Files app so the user
        # can create a neutral local folder there. Stylus's own Documents
        # folder stays empty (music lives outside the sandbox via the picker);
        # exposing it is purely so On My iPhone becomes visible.
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        # Launch storyboard renders the app icon at 180 pt (rounded
        # square) centered on the system background. The SwiftUI
        # SplashView reproduces the same visual once SwiftUI takes
        # over, so the transition from launch chrome to the SwiftUI
        # tree is invisible.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greghcarr.stylus.ios
        PRODUCT_NAME: Stylus
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/StylusBridge/StylusBridge.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Sources/StylusBridge
        OTHER_LDFLAGS:
          - $(inherited)
          - -ObjC
          - -lStylusCore
          - -lc++
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - $(inherited)
          - $(SRCROOT)/build-ios-device/$(CONFIGURATION)-iphoneos
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(inherited)
          - $(SRCROOT)/build-ios-sim/$(CONFIGURATION)-iphonesimulator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: Accelerate.framework
      - sdk: QuartzCore.framework
      - sdk: Foundation.framework
      - sdk: UIKit.framework
    preBuildScripts:
      - name: Build StylusCore via CMake
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
        shell: /bin/bash
        script: |
          set -euo pipefail

          # Capture only the few Xcode-provided variables we actually use,
          # then run cmake with `env -i` so none of Xcode's other
          # toolchain / SDK env vars (SDKROOT, TOOLCHAINS, SDK_DIR,
          # *_DEPLOYMENT_TARGET, ...) leak into the recursive cmake call
          # JUCE makes to bootstrap juceaide for the host. juceaide is a
          # macOS host tool; if it sees SDKROOT=iphoneos it tries to build
          # itself against the iOS SDK and host-compiler detection fails.
          STYLUS_SRCROOT="${SRCROOT}"
          STYLUS_PLATFORM="${PLATFORM_NAME}"
          STYLUS_CONFIG="${CONFIGURATION}"
          STYLUS_DEVELOPER_DIR="$(xcode-select -p)"

          case "${STYLUS_PLATFORM}" in
            iphoneos)        STYLUS_BUILD_DIR="build-ios-device" ;;
            iphonesimulator) STYLUS_BUILD_DIR="build-ios-sim"    ;;
            *)               echo "Unsupported PLATFORM_NAME: ${STYLUS_PLATFORM}" >&2; exit 1 ;;
          esac

          run_cmake() {
            env -i \
              HOME="${HOME}" \
              USER="${USER}" \
              PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin" \
              DEVELOPER_DIR="${STYLUS_DEVELOPER_DIR}" \
              "$@"
          }

          if ! command -v cmake >/dev/null 2>&1 \
              && [ ! -x /opt/homebrew/bin/cmake ] \
              && [ ! -x /usr/local/bin/cmake ]; then
            echo "error: cmake not found - install with: brew install cmake" >&2
            exit 1
          fi

          cd "${STYLUS_SRCROOT}"

          # Fast-path: if libStylusCore.a is up to date relative to every
          # source under the cmake target's footprint, skip cmake entirely.
          # Cuts ~5 s off iterations that don't touch the bridge or the C++
          # core (most Swift-only edits).
          STYLUS_LIB="${STYLUS_BUILD_DIR}/${STYLUS_CONFIG}-${STYLUS_PLATFORM}/libStylusCore.a"
          STYLUS_PROJ="${STYLUS_BUILD_DIR}/StylusIOS.xcodeproj/project.pbxproj"
          if [ -f "${STYLUS_LIB}" ] && [ -f "${STYLUS_PROJ}" ]; then
            NEWER_SOURCES=$(find Sources/StylusBridge External/stylus/src CMakeLists.txt \
                                 -type f -newer "${STYLUS_LIB}" 2>/dev/null | head -1)
            if [ -z "${NEWER_SOURCES}" ]; then
              echo "StylusCore up to date; skipping cmake."
              exit 0
            fi
          fi

          # Slow-path: re-configure + re-build. Always run configure here
          # because skipping it leaves us broken when a previous configure
          # aborted mid-flight (CMakeCache.txt exists but the generated
          # .xcodeproj doesn't).
          # CMAKE_XCODE_ATTRIBUTE_CODE_SIGN* flags disable signing on every
          # target in the inner Xcode project: static libs don't need
          # signing, and JUCE's juceaide host tool would otherwise ask for
          # an iOS provisioning profile when built under the iOS context.
          run_cmake cmake -B "${STYLUS_BUILD_DIR}" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="${STYLUS_PLATFORM}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

          run_cmake cmake --build "${STYLUS_BUILD_DIR}" --config "${STYLUS_CONFIG}"

  # Unit tests for the Swift-side modules that don't depend on UIKit /
  # SwiftUI: PlayQueue logic, future Library helpers, etc. Imported with
  # @testable import Stylus so they reach internal types directly. Test
  # target runs hosted (TEST_HOST = StylusApp) so the same StylusCore
  # static lib doesn't need re-linking standalone; in practice the
  # PlayQueue tests don't touch the C++ core, but other tests we add
  # later might. Run via: make test (or Cmd-U in Xcode).
  StylusAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/StylusAppTests
    dependencies:
      - target: StylusApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greghcarr.stylus.ios.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Stylus.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Stylus
        BUNDLE_LOADER: $(TEST_HOST)
        # Device builds need a real Info.plist to sign against; sim
        # builds let it slide. Auto-generate so the recipe works on
        # both. PRODUCT_NAME pins the bundle's CFBundleName so the
        # generated plist is sane.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: StylusAppTests
    scheme:
      testTargets:
        - StylusAppTests
